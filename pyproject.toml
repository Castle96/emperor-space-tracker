[project]
name = "emperor-space-tracker"
version = "0.1.0"
description = "Edge GIS monitoring node fusing NOAA space weather, Sentinel-1 fast-ice SAR backscatter, and Emperor penguin colony census data."
readme = "README.md"
authors = [
    { name = "Kyle Castle", email = "kcastle96@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["antarctica", "emperor-penguin", "sar", "sentinel-1", "space-weather", "noaa", "gee", "gis", "edge", "systemd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

# The daemon core is intentionally dependency-free: it runs on the Python
# standard library alone so that a field node can be provisioned on Arch,
# Ubuntu, Debian, RHEL or Alpine with no wheel resolution, no compiler and no
# transitive dependency tree to audit. The measured peak resident set of a full
# polling pass is ~35.8 MiB, bounded by daemon.max_rss_bytes (48 MiB default);
# see [tool.emperor] and the memory notes in data/default.toml.
dependencies = []

[project.optional-dependencies]
# Google Earth Engine access for real Sentinel-1 backscatter. The dataset is
# selected from sar.polarisation: VV/VH read the GRD product, HH/HV require RAW.
sar = ["earthengine-api>=1.5"]
# Streamlit + Plotly frontend. Never imported by the daemon process.
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
# Convenience: everything needed to answer "what could it possibly need?".
all = [
    "earthengine-api>=1.5",
    "streamlit>=1.40",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
emperor-space-tracker = "emperor_space_tracker.cli:main"
est = "emperor_space_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/kcastle96/emperor-space-tracker"
Issues = "https://github.com/kcastle96/emperor-space-tracker/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "emperor_space_tracker"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:emperor_space_tracker.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PTH",      # pathlib
    "TID",      # tidy imports
    "PL",       # pylint
    "RUF",      # ruff-specific
    "S",        # bandit
    "ANN",      # annotations
    "ASYNC",
    "D",        # pydocstyle
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is legitimate for decoded JSON payloads
    "S101",   # asserts are fine, this is not a web service
    # The package uses explicit relative imports throughout. TID252 wants
    # absolute ones, which is a real trade-off and not a correctness one:
    # absolute imports here would still work under `uv_build`, but relative
    # imports make it structurally impossible to accidentally create a second
    # import identity for the same module, which is the actual hazard the rule
    # is aiming at.
    "TID252",
    # `== 0` on floats and `> 1` style comparisons dominate the numeric parsing
    # and threshold code, where the literal *is* the domain (a null sentinel, a
    # physical cutoff). An allowlist of magic values would be longer than the
    # code it annotates and would rot on the first rule change.
    "PLR2004",
    # Deferred imports are load-bearing here, not sloppiness. The whole memory
    # budget depends on `earthengine-api` staying out of the daemon's import
    # graph, and `streamlit`/`plotly` out of the CLI's; both are only imported
    # inside the function that needs them.
    "PLC0415",
    # The NOAA record parsers, the rule dispatcher and the poll state machine
    # are wide by nature: each is a flat table of cases that is far easier to
    # audit as one function than split into helpers that each take six
    # parameters and return an ambiguous Optional.
    "PLR0912",
    "PLR0915",
    "PLR0913",
    "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
# Tests document intent rather than restating the function name, so the
# docstring rules are relaxed. S603/S607 are exempt for the same reason as
# deploy.py above: the only subprocess call in the suite is systemd-analyze,
# invoked with a literal argv and never shell=True, to confirm the generated
# unit file still parses.
"tests/*" = [
    "D100", "D101", "D102", "D103", "D104", "D400", "D415",
    "PLR2004", "S105", "S106", "S404", "S603", "S607", "PLW1510",
]
# Module-wide exemptions, each of which is an invariant enforced in code rather
# than at a call site. Exempting the whole module is deliberate: these rules
# would otherwise need an inline `noqa` at every call, and inline suppressions
# are what drift out of sync with the code they were written for.
#
# net.py is the only module that opens a URL, and every path through it calls
# require_http_url() first, which rejects any scheme outside {http, https}.
"src/emperor_space_tracker/net.py" = ["S310"]
# subprocess with a literal argv list and never shell=True. Audit-writable by
# design; the point of S603 is to force a look, and the look has been done.
"src/emperor_space_tracker/deploy.py" = ["S404", "S603"]
"src/emperor_space_tracker/memory.py" = [
    "S404", "S603",
    # Module-level libc handle cache for malloc_trim, resolved once on first use.
    "PLW0603",
]
# Table names in f-strings come from the module-level _PRUNABLE/_TABLES
# literals, never from configuration or user input.
"src/emperor_space_tracker/store.py" = ["S608"]
# The dashboard is an optional-extra view layer. Its type annotations are
# deliberately loose (Any) because streamlit and plotly ship no usable types,
# and it is the one module where building a literal is spelled dict(...) for
# readability at call sites that map database rows to table columns.
"src/emperor_space_tracker/dashboard/*.py" = [
    "ANN401", "C408", "D100", "D103", "E501", "F401", "PLR0913", "PLR0915",
    "S311",
]
# The synthetic SAR simulator is a seeded PRNG by definition, and its
# reproducibility is a tested property rather than an accident. `import
# earthengine` in the same module is a capability probe, not an unused import.
"src/emperor_space_tracker/sources/sar.py" = ["S311", "F401"]
# Seeded demo data for `est seed`, not a cryptographic value.
"src/emperor_space_tracker/cli.py" = ["S311"]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/emperor_space_tracker", "tests"]
# The dashboard layer pulls optional third-party types that are not present in
# the daemon environment; it is excluded from the strict gate.
[[tool.mypy.overrides]]
module = [
    "emperor_space_tracker.dashboard.*",
    "earthengine",
    "plotly",
    "plotly.*",
    "streamlit",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/emperor_space_tracker"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
