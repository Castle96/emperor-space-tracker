# -----------------------------------------------------------------------------
# Pygoscelis kerguelensis -- southeastern gentoo penguin
# -----------------------------------------------------------------------------
# Described as a species distinct from the other gentoos in Daly, Younger,
# Pertierra et al., "Integrative evidence reveals adaptive divergence and
# speciation in gentoo penguins", Communications Biology 9:798 (2026), which
# split Pygoscelis papua into four species on whole-genome and morphological
# evidence. It is a *gentoo*, not an Emperor and not an Adélie, and it is
# catalogued here as a second, non-fast-ice species.
#
# The reason it belongs in the file at all is that the two fields
# `species` and `breeding_habitat` exist to make exactly this distinction
# explicit. A gentoo nests on bare ground -- beaches, moraines, gravel,
# tussock -- and forages inshore in open water. It breeds at ~49 degrees S,
# where there is no polar night, so none of the fast-ice machinery applies to
# it and the SAR client declines to image it.
#
# TAXONOMY WARNING. This name is newer than most of the literature referring to
# these birds. The 2020 Tyler et al. revision called the Kerguelen population
# P. taeniata; the 2026 paper supersedes that and names it P. kerguelensis.
# The 2026 treatment also places Heard Island here, where the 2020 treatment
# put it in P. poncetii. The 2026 names are what this catalogue uses. If you
# find an older source citing "P. papua" for these colonies, that is a
# taxonomic difference and not a mistake in the count.
#
# GBIF WARNING, verified against api.gbif.org on 2026-09-29: the backbone has no
# species-level record for P. kerguelensis, so species/match resolves the name to
# the GENUS Pygoscelis (usageKey 2481662, matchType HIGHERRANK). Any occurrence
# scan for this species therefore returns records for every Pygoscelis species
# and the client logs a warning and says so in the source-health detail. The
# colony figures below do not come from GBIF and are unaffected; only the
# presence evidence is broader than the species. This resolves itself when the
# backbone ingests the 2026 name.
#
# DATA GAP, stated plainly: the Indian Ocean sector of this species has not
# been comprehensively surveyed since the mid-1980s. Herman et al. 2020
# (Polar Biology) name it one of the most critical data gaps for the gentoo
# complex, at roughly 14% of the global population. The most recent
# archipelago-wide figure below is from 1985 -- 41 years stale as of this
# catalogue. Only the Courbet Peninsula has a recent count, because a
# research station sits on it. Treat the Heard Island figure as indicative.
# -----------------------------------------------------------------------------

[[colony]]
id = "pgk-courbet-peninsula"
name = "Courbet Peninsula"
latitude = -49.250
longitude = 70.200
region = "Kerguelen Islands, Southern Indian Ocean"
population = 8392
population_year = 2018
population_source = "Barbraud 2020, French Southern Territories penguin population trends (BPB 43); count by H. Weimerskirch"
species = "Pygoscelis kerguelensis"
common_name = "Southeastern gentoo penguin"
breeding_habitat = "land"
last_census = "2018-12-01"
notes = "Nests on bare ground and short vegetation near Port-aux-Français, the only permanent station in the archipelago, which is why it is the one Kerguelen colony with a current count. Population grew at 1.002 per year (95% CI 0.986-1.018) over 1988-2018, +9.5% across the window, having fallen ~30% between the mid-1980s and mid-2000s on inshore food shortage (Lescroël & Bost 2006) before recovering above its 1985 size. Note the 8,800 pairs recorded for the peninsula as a whole in 1989 (BirdLife International IBA 6905) is a wider boundary than the monitored sub-colonies, so the two are not directly comparable."

[[colony]]
id = "pgk-heard-island"
name = "Heard Island (Atlas Cove sector)"
latitude = -53.100
longitude = 73.500
region = "Heard Island and McDonald Islands, Australian external territory"
population = 16574
population_year = 1987
population_source = "Woehler 1993, via Herman et al. 2020, Polar Biology (global gentoo abundance assessment)"
species = "Pygoscelis kerguelensis"
common_name = "Southeastern gentoo penguin"
breeding_habitat = "land"
last_census = "1987-12-15"
notes = "SPECIES ASSIGNMENT IS INFERENTIAL, NOT MEASURED. The 2026 revision has no molecular data from Heard Island: all 64 genomes came from Kerguelen and Crozet. The placement rests on satellite tracking that recorded juvenile Kerguelen birds foraging at Heard, which the authors read as a single evolutionary unit. The population figure is a 1987 census and is 39 years old. Also recorded as declining across this period. Recorded here because omitting the island would misrepresent the species' range, not because the assignment is settled."

# -----------------------------------------------------------------------------
# Known Kerguelen localities with NO usable colony-level census
# -----------------------------------------------------------------------------
# A data gap, recorded so nobody mistakes absence from this file for absence of
# breeding birds. The following hold gentoo colonies and are regularly
# monitored for trend, but no archipelago-wide census since Weimerskirch et al.
# 1988 means there is no defensible per-site breeding-pair figure to put in a
# field that claims to be a breeding-pair count:
#
#   Ile Longue (Longue Island), Golfe du Morbihan  - studied by Lescroël &
#     Bajzak & Bost as a sheltered "closed sea" site; foraging range 3.6-11.6 km.
#   Ile Penn (Penn Island), Golfe du Morbihan
#   four capes within the Golfe du Morbihan
#   south coast of the Jeanne d'Arc Peninsula
#
# The 18,554 pairs reported for the Jeanne d'Arc Peninsula in 2017 that appear
# in the same literature are MACARONI penguins, not gentoos. Do not merge them.
#
# The Kerguelen archipelago total is 35,000 pairs (Weimerskirch et al. 1988,
# 1985 census, via Herman et al. 2020). It is deliberately not entered as a
# colony record: an archipelago total is a different measurement from a colony,
# and putting one in a table of per-colony counts invites the two to be summed.
# =============================================================================
