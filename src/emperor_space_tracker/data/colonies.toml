# =============================================================================
# Penguin breeding colony reference catalogue
# =============================================================================
# This catalogue is multi-species. Every record names its `species` and its
# `breeding_habitat`, and those two fields are what decide which of this node's
# monitoring channels apply to it.
#
# Population figures are BREEDING PAIR estimates (or fledglings where noted) from
# the SCAR CEMP / CCAMLR ecosystem monitoring record and the published literature.
# They are NOT derived from GBIF occurrence density, which reflects observer
# effort rather than bird numbers.
#
# `fast_ice_ratio` is the proportion of the fast-ice season the colony can
# access, from the published life-cycle literature. For a `breeding_habitat =
# "fast_ice"` record it is the single most important field in this file for the
# project: a colony that must sustain a breeding cycle on fast ice that
# disappears in December is exposed to catastrophic breeding failure, and the SAR
# backscatter trend is how a monitoring node detects that happening in time to
# matter.
#
# For a `breeding_habitat = "land"` record `fast_ice_ratio` is absent and
# `monitors_fast_ice` is false. That is not a gap in the data -- fast-ice access
# is not a property of a bird that nests on a beach. The SAR client skips these
# colonies and the fast-ice alert ignores them, because a sigma0 measured over a
# land-nesting colony describes the nearby water and every classification band
# downstream is calibrated for consolidated sea ice.
#
# `population` values carry an explicit `population_year` because a census is
# a snapshot, not a constant. Presenting a 2016 count without a date is how
# these numbers get misused.
#
# This file is data, not code: a domain expert reviewing a new census season
# edits it here, and `est colonies --show` renders the result. It is a curated
# stand-in for the SCAR portal, which publishes no queryable API (see
# emperor_space_tracker/sources/biological.py for the full rationale).
# =============================================================================

# -----------------------------------------------------------------------------
# Aptenodytes forsteri -- Emperor penguin
# -----------------------------------------------------------------------------
# The only penguin in the world that breeds on sea ice, and the only species
# this node was originally built to monitor. It is the sole reason the fast-ice
# pipeline exists.
# -----------------------------------------------------------------------------

